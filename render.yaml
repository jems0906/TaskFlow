databases:
  - name: taskflow-postgres
    databaseName: taskflow
    user: taskflow
    plan: free

services:
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  - type: web
    name: taskflow-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm ci --prefix .builddeps && npm run _build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false